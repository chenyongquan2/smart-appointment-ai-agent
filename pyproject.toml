[project]
name = "smart-appointment-ai-agent"
version = "0.1.0"
description = "面向按摩门店场景的智能预约与咨询系统（多 Agent + RAG + FastAPI）"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.9",
    "pydantic>=2.5.1",
    "aiofiles>=23.2.1",
    "python-dotenv>=1.0.0",
    "langchain>=0.3,<1.0",
    "langchain-openai>=0.2,<1.0",
    "langchain-core>=0.3,<1.0",
    "langchain-community>=0.3,<1.0",
    "langchain-experimental>=0.3,<1.0",
    "faiss-cpu>=1.7.0",
    "numpy>=1.21.0",
    "schedule>=1.2.0",
    "sqlalchemy>=1.4.0",
    "requests>=2.25.0",
    "mcp>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false
