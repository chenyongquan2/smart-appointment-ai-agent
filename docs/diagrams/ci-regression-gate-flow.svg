<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans, system-ui, sans-serif)" role="img">
<title>CI 回归门禁流程：跑评估 → 比对基线 → 退出码判定</title>
<desc>run_evals.py 带 --gate 参数运行：先检查用例文件和 API key 是否就绪，就绪后跑评估算出当前指标，再与 baseline.json 比对。若被守指标（意图分类准确率、工具调用 F1、槽位完整率）低于基线减容差，则判定为回归，退出码 3，阻断归档；否则退出码 0，放行。文件缺失退出码 1，用例非法或无 API key 优雅降级退出码 2。</desc>

<defs>
<marker id="arr5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-secondary,#6b7280)"/>
</marker>
<style>
  .t { fill: var(--color-text-primary,#1f2937); }
  .m { fill: var(--color-text-secondary,#6b7280); }
  .h { font-weight: 700; }
  .box-title { font-weight: 600; font-size: 13.5px; }
  .note { font-size: 11.5px; fill: var(--color-text-secondary,#6b7280); }
  .code { font-family: var(--font-mono,monospace); }
</style>
</defs>

<text x="430" y="26" text-anchor="middle" class="t h" font-size="17">CI 回归门禁：run_evals.py --gate</text>

<!-- Start -->
<rect x="30" y="55" width="130" height="46" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="95" y="83" text-anchor="middle" class="note">跑 --gate</text>

<line x1="160" y1="78" x2="205" y2="78" stroke="var(--color-text-secondary,#6b7280)" stroke-width="1.5" marker-end="url(#arr5)"/>

<!-- cases file check -->
<polygon points="210,78 275,50 340,78 275,106" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
<text x="275" y="74" text-anchor="middle" class="note">用例文件</text>
<text x="275" y="88" text-anchor="middle" class="note">存在？</text>

<line x1="275" y1="106" x2="275" y2="140" stroke="var(--color-text-secondary,#6b7280)" stroke-width="1.3" marker-end="url(#arr5)"/>
<text x="285" y="128" class="note">是</text>
<rect x="70" y="45" width="0" height="0"/>
<line x1="210" y1="78" x2="130" y2="78" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr5)"/>
<text x="150" y="68" class="note" fill="#dc2626">否</text>
<rect x="30" y="55" width="0" height="0" opacity="0"/>
<rect x="30" y="115" width="100" height="40" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="80" y="138" text-anchor="middle" class="code" font-size="12" fill="#dc2626">exit 1</text>

<!-- API key check -->
<polygon points="210,175 275,147 340,175 275,203" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
<text x="275" y="171" text-anchor="middle" class="note">API key /</text>
<text x="275" y="185" text-anchor="middle" class="note">用例合法？</text>

<line x1="275" y1="203" x2="275" y2="230" stroke="var(--color-text-secondary,#6b7280)" stroke-width="1.3" marker-end="url(#arr5)"/>
<text x="285" y="220" class="note">是</text>

<line x1="210" y1="175" x2="130" y2="175" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr5)"/>
<text x="150" y="165" class="note" fill="#dc2626">否</text>
<rect x="30" y="155" width="100" height="40" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="80" y="178" text-anchor="middle" class="code" font-size="12" fill="#dc2626">exit 2</text>
<text x="80" y="200" text-anchor="middle" class="note">优雅降级</text>

<!-- Run evals + compare baseline -->
<rect x="185" y="235" width="180" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="275" y="256" text-anchor="middle" class="box-title t">真跑评估</text>
<text x="275" y="273" text-anchor="middle" class="note">算出当前指标</text>

<line x1="365" y1="260" x2="410" y2="260" stroke="var(--color-text-secondary,#6b7280)" stroke-width="1.5" marker-end="url(#arr5)"/>

<rect x="415" y="235" width="180" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="505" y="256" text-anchor="middle" class="box-title t">比对 baseline.json</text>
<text x="505" y="273" text-anchor="middle" class="note">意图 / 工具F1 / 槽位</text>

<line x1="595" y1="260" x2="640" y2="260" stroke="var(--color-text-secondary,#6b7280)" stroke-width="1.5" marker-end="url(#arr5)"/>

<!-- regression decision -->
<polygon points="645,260 720,225 795,260 720,295" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
<text x="720" y="256" text-anchor="middle" class="note">当前 &lt; 基线</text>
<text x="720" y="270" text-anchor="middle" class="note">− 容差？</text>

<line x1="720" y1="295" x2="720" y2="330" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr5)"/>
<text x="730" y="315" class="note" fill="#dc2626">是（回归）</text>
<rect x="655" y="335" width="130" height="46" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="720" y="355" text-anchor="middle" class="code t" font-size="13">exit 3</text>
<text x="720" y="372" text-anchor="middle" class="note">阻断归档</text>

<line x1="645" y1="260" x2="600" y2="330" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr5)"/>
<text x="600" y="315" class="note" fill="#16a34a">否（放行）</text>
<rect x="440" y="335" width="130" height="46" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="505" y="355" text-anchor="middle" class="code t" font-size="13">exit 0</text>
<text x="505" y="372" text-anchor="middle" class="note">正常通过</text>

<text x="430" y="405" text-anchor="middle" class="note">接进 phase.md 闸门 2：exit 3 阻断归档 · exit 2 跳过 · exit 1 警告</text>

</svg>
