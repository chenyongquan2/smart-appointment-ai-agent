<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans, system-ui, sans-serif)" role="img">
<title>评估系统成熟度阶梯：L0 到 L3</title>
<desc>四级台阶，从低到高：L0 Demo 靠感觉无用例；L1 离线回归，固定用例加指标防回归；L2 完整功能，轨迹、judge、RAG、CI 门禁齐全；L3 生产级，在线持续评估加监控告警加数据治理加 SLO。本项目当前处于 L1，功能改造做完后到 L2，L3 是后续如果有真实流量和团队才值得投入的方向。</desc>

<defs>
<style>
  .t { fill: var(--color-text-primary,#1f2937); }
  .m { fill: var(--color-text-secondary,#6b7280); }
  .h { font-weight: 700; }
  .step-title { font-weight: 700; font-size: 15px; }
  .note { font-size: 12px; fill: var(--color-text-secondary,#6b7280); }
</style>
</defs>

<text x="410" y="26" text-anchor="middle" class="t h" font-size="17">评估系统成熟度阶梯</text>

<!-- Staircase steps, ascending left to right -->
<!-- L0 -->
<rect x="40" y="300" width="170" height="40" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="55" y="290" class="step-title t">L0 · Demo</text>
<text x="55" y="325" class="note">靠感觉，无用例</text>

<!-- L1 -->
<rect x="210" y="240" width="170" height="100" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="225" y="230" class="step-title t">L1 · 离线回归</text>
<text x="225" y="265" class="note">固定用例 + 指标</text>
<text x="225" y="281" class="note">+ 防回归</text>
<text x="225" y="303" class="note" font-weight="700" fill="#2563eb">◀ 本项目现在在这</text>

<!-- L2 -->
<rect x="380" y="150" width="170" height="190" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="395" y="140" class="step-title t">L2 · 完整功能</text>
<text x="395" y="175" class="note">轨迹 / judge / RAG</text>
<text x="395" y="191" class="note">/ CI 门禁齐全</text>
<text x="395" y="213" class="note" font-weight="700" fill="#16a34a">◀ §13 做完到这</text>

<!-- L3 -->
<rect x="550" y="60" width="230" height="280" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="565" y="50" class="step-title t">L3 · 生产级</text>
<text x="565" y="85" class="note">在线持续评估</text>
<text x="565" y="101" class="note">+ 监控告警</text>
<text x="565" y="117" class="note">+ 数据治理</text>
<text x="565" y="133" class="note">+ SLO</text>
<text x="565" y="155" class="note" font-weight="700" fill="#dc2626">◀ §14，有真实流量</text>
<text x="565" y="171" class="note" font-weight="700" fill="#dc2626">和团队才值得投入</text>

<!-- baseline -->
<line x1="40" y1="340" x2="780" y2="340" stroke="#d1d5db" stroke-width="1"/>

<text x="410" y="365" text-anchor="middle" class="note">面试时先定位「我在 L1，§13 做完到 L2」，再讲「L3 要补的四层」——条理立现</text>

</svg>
