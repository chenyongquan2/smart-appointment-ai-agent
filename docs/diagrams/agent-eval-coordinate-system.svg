<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans, system-ui, sans-serif)" role="img">
<title>评哪层 × 何时评：全项目对照图</title>
<desc>一张对照表，上下方向分三层：组件级、端到端轨迹级、系统级，越往上越难测但越接近业务问题。左右方向分两种时机：离线评估、在线评估，越往右越接近真实生产分布。表里每一格标注了本项目在该场景的现状：已具备、部分具备或缺失。</desc>

<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-secondary,#6b7280)"/>
</marker>
<style>
  .t { fill: var(--color-text-primary,#1f2937); }
  .m { fill: var(--color-text-secondary,#6b7280); }
  .h { font-weight: 700; }
  .cell-title { font-weight: 600; font-size: 15px; }
  .cell-note { font-size: 12.5px; fill: var(--color-text-secondary,#6b7280); }
  .grid-line { stroke: #e5e7eb; stroke-width: 1; }
</style>
</defs>

<!-- Title -->
<text x="430" y="28" text-anchor="middle" class="t h" font-size="17">评哪层 × 何时评：全项目对照图</text>
<text x="430" y="48" text-anchor="middle" class="m" font-size="13">上下看 = 评哪一层，左右看 = 什么时候评 —— 每一格 = 一个具体评估场景</text>

<!-- Y axis -->
<line x1="70" y1="500" x2="70" y2="95" stroke="var(--color-text-secondary,#6b7280)" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="46" y="300" class="m" font-size="15" transform="rotate(-90 46 300)" text-anchor="middle">评哪一层</text>

<!-- X axis -->
<line x1="110" y1="520" x2="800" y2="520" stroke="var(--color-text-secondary,#6b7280)" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="455" y="545" class="m" font-size="15" text-anchor="middle">什么时候评</text>

<!-- Row labels -->
<text x="60" y="470" text-anchor="end" class="t h" font-size="14">组件级</text>
<text x="60" y="486" text-anchor="end" class="cell-note">最易测</text>

<text x="60" y="310" text-anchor="end" class="t h" font-size="14">端到端</text>
<text x="60" y="326" text-anchor="end" class="t h" font-size="14">轨迹级</text>

<text x="60" y="150" text-anchor="end" class="t h" font-size="14">系统级</text>
<text x="60" y="166" text-anchor="end" class="cell-note">最难测</text>

<!-- Column labels -->
<text x="270" y="90" text-anchor="middle" class="t h" font-size="14">离线评估</text>
<text x="270" y="107" text-anchor="middle" class="cell-note">固定用例·防回归</text>

<text x="620" y="90" text-anchor="middle" class="t h" font-size="14">在线评估</text>
<text x="620" y="107" text-anchor="middle" class="cell-note">真实流量·抓问题</text>

<!-- Grid lines -->
<line x1="440" y1="118" x2="440" y2="500" class="grid-line"/>
<line x1="110" y1="245" x2="800" y2="245" class="grid-line"/>
<line x1="110" y1="372" x2="800" y2="372" class="grid-line"/>
<rect x="110" y="118" width="690" height="382" fill="none" stroke="#d1d5db" stroke-width="1"/>

<!-- Row1 (top): 系统级 — 离线本质不适用(灰)，在线真实缺口(红) -->
<g>
  <text x="130" y="145" font-size="20">&#10134;</text>
  <text x="160" y="145" class="t cell-title">系统级 &#215; 离线</text>
  <text x="130" y="168" class="cell-note">本质不适用：业务 KPI 需真实</text>
  <text x="130" y="186" class="cell-note">用户结果，固定离线集造不出</text>
</g>
<g>
  <text x="480" y="145" font-size="20">&#10060;</text>
  <text x="510" y="145" class="t cell-title">系统级 &#215; 在线</text>
  <text x="480" y="168" class="cell-note">业务指标唯一合理归宿</text>
  <text x="480" y="186" class="cell-note">= 真实缺口（无流量故没做）</text>
</g>

<!-- Row2 (middle): 轨迹级 — 部分具备，用琥珀 -->
<g>
  <text x="130" y="272" font-size="20">&#9989;&#9888;&#65039;</text>
  <text x="185" y="272" class="t cell-title">轨迹级 &#215; 离线</text>
  <text x="130" y="295" class="cell-note">真驱动 AgentLoop，工具调用</text>
  <text x="130" y="312" class="cell-note">参数/序列级 P·R·F1；多轮部分</text>
</g>
<g>
  <text x="480" y="272" font-size="20">&#9888;&#65039;</text>
  <text x="512" y="272" class="t cell-title">轨迹级 &#215; 在线</text>
  <text x="480" y="295" class="cell-note">trace→triage 半自动甄别失控</text>
  <text x="480" y="312" class="cell-note">信号；无真实流量，是模拟</text>
</g>

<!-- Row3 (bottom): 组件级 — 已具备，用绿 -->
<g>
  <text x="130" y="400" font-size="20">&#9989;</text>
  <text x="160" y="400" class="t cell-title">组件级 &#215; 离线</text>
  <text x="130" y="423" class="cell-note">意图分类器真评，逐条比对</text>
  <text x="130" y="440" class="cell-note">真实 classify_task 输出</text>
</g>
<g>
  <text x="480" y="400" font-size="20">&#9888;&#65039;</text>
  <text x="512" y="400" class="t cell-title">组件级 &#215; 在线</text>
  <text x="480" y="423" class="cell-note">trace 里能看到分类调用</text>
  <text x="480" y="440" class="cell-note">但未系统性评在线组件质量</text>
</g>

<!-- Legend -->
<text x="110" y="524" class="cell-note">图例：✅ 已真评　⚠️ 部分/机制有但不完整　❌ 真实缺口（该做没做）　➖ 本质不适用（该组合天生别扭）</text>
<text x="110" y="542" class="cell-note">注：成立的格子连成一条对角线——组件级偏离线、系统级偏在线，只有轨迹级真横跨两者。完整证据见文档 §10</text>

</svg>
