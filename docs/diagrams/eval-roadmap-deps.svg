<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans, system-ui, sans-serif)" role="img">
<title>评估改造路线图与依赖关系</title>
<desc>八项改造的依赖关系。改造1接AgentLoop是地基，解锁改造2工具调用做严和改造3治非确定性；改造4 LLM-judge独立可并行；改造1和2出真数后支撑改造6 CI门禁，门禁又支撑改造7在线闭环；改造8数据集扩充贯穿始终持续做；改造5 RAG评估暂缓待外部服务迁移。改造1到4、6、7已落地，改造8切片1已落地、切片2实现完成但收尾未完，改造5暂缓。</desc>

<defs>
<marker id="arrRm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-secondary,#6b7280)"/>
</marker>
<style>
  .t { fill: var(--color-text-primary,#1f2937); }
  .m { fill: var(--color-text-secondary,#6b7280); }
  .h { font-weight: 700; }
  .node-title { font-weight: 600; font-size: 13px; }
  .node-sub { font-size: 10.5px; }
  .legend { font-size: 12px; }
</style>
</defs>

<text x="410" y="26" text-anchor="middle" class="t h" font-size="17">改造路线图 · 依赖与状态</text>

<!-- legend -->
<rect x="250" y="40" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/>
<text x="270" y="52" class="m legend">已落地</text>
<rect x="345" y="40" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706"/>
<text x="365" y="52" class="m legend">部分 / 收尾未完</text>
<rect x="500" y="40" width="14" height="14" rx="3" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="520" y="52" class="m legend">暂缓</text>

<!-- 改造1 -->
<rect x="40" y="90" width="150" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="115" y="112" text-anchor="middle" class="t node-title">改造1 · 接 AgentLoop</text>
<text x="115" y="130" text-anchor="middle" class="m node-sub">地基 / 解锁最多 ✅</text>

<!-- 改造2 -->
<rect x="270" y="70" width="150" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="345" y="90" text-anchor="middle" class="t node-title">改造2 · 工具调用做严</text>
<text x="345" y="108" text-anchor="middle" class="m node-sub">参数级 / 序列级 ✅</text>

<!-- 改造3 -->
<rect x="270" y="130" width="150" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="345" y="150" text-anchor="middle" class="t node-title">改造3 · 治非确定性</text>
<text x="345" y="168" text-anchor="middle" class="m node-sub">采样 + 置信区间 ✅</text>

<!-- 改造6 -->
<rect x="500" y="100" width="150" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="575" y="120" text-anchor="middle" class="t node-title">改造6 · CI 门禁</text>
<text x="575" y="138" text-anchor="middle" class="m node-sub">基线 + 阈值阻断 ✅</text>

<!-- 改造7 -->
<rect x="670" y="100" width="130" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="735" y="120" text-anchor="middle" class="t node-title">改造7 · 在线闭环</text>
<text x="735" y="138" text-anchor="middle" class="m node-sub">trace→回灌 ✅</text>

<!-- 改造4 (independent) -->
<rect x="40" y="200" width="150" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="115" y="220" text-anchor="middle" class="t node-title">改造4 · LLM-judge</text>
<text x="115" y="238" text-anchor="middle" class="m node-sub">独立并行 · 未校准 ✅</text>

<!-- 改造8 -->
<rect x="270" y="270" width="240" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="390" y="291" text-anchor="middle" class="t node-title">改造8 · 数据集扩充（贯穿始终）</text>
<text x="390" y="308" text-anchor="middle" class="m node-sub">切片1 稳定门禁守3项 ✅</text>
<text x="390" y="323" text-anchor="middle" class="m node-sub">切片2 多轮用例 ⚠️ 收尾未完 · 规模化/held-out 续做</text>

<!-- 改造5 -->
<rect x="590" y="270" width="210" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="695" y="294" text-anchor="middle" class="t node-title">改造5 · RAG 评估</text>
<text x="695" y="314" text-anchor="middle" class="m node-sub">⏸️ 暂缓（待外部服务迁移）</text>

<!-- edges -->
<line x1="190" y1="110" x2="265" y2="92" stroke="var(--color-text-secondary,#6b7280)" stroke-width="1.3" marker-end="url(#arrRm)"/>
<line x1="190" y1="122" x2="265" y2="150" stroke="var(--color-text-secondary,#6b7280)" stroke-width="1.3" marker-end="url(#arrRm)"/>
<line x1="420" y1="95" x2="495" y2="118" stroke="var(--color-text-secondary,#6b7280)" stroke-width="1.3" marker-end="url(#arrRm)"/>
<line x1="420" y1="155" x2="495" y2="130" stroke="var(--color-text-secondary,#6b7280)" stroke-width="1.3" marker-end="url(#arrRm)"/>
<line x1="650" y1="125" x2="665" y2="125" stroke="var(--color-text-secondary,#6b7280)" stroke-width="1.3" marker-end="url(#arrRm)"/>

<!-- 改造1+2 → 6 label -->
<text x="460" y="200" text-anchor="middle" class="m node-sub" font-style="italic">改造1+2 出真数 → 支撑门禁</text>

<!-- 5 depends on 4 (dashed) -->
<line x1="150" y1="250" x2="600" y2="278" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrRm)"/>
<text x="360" y="256" text-anchor="middle" class="m node-sub" font-style="italic">改造5 三元组复用改造4 的 judge</text>

</svg>
