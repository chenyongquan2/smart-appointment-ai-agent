<svg viewBox="0 0 820 660" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans, system-ui, sans-serif)" role="img">
<title>记忆压缩流程图</title>
<desc>展示对话消息按 turn id 排列，window_turns 划出窗内/窗外，covered_upto 书签标记已压入摘要的位置，夹缝是掉出窗口但还没压缩的消息；以及压缩触发后夹缝归零、再积累的节奏。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-secondary, #6b7280)"/>
</marker>
<style>
.t{fill:var(--color-text-primary,#1f2937);}
.m{fill:var(--color-text-secondary,#6b7280);}
.h{font-weight:700;}
.id{font-family:var(--font-mono,monospace);font-weight:700;}
.box{stroke-width:1.5;rx:6;}
</style>
</defs>

<!-- ===== Panel A: snapshot ===== -->
<text x="40" y="34" class="t h" font-size="17">① 某一刻的快照（设 window_turns = 4）</text>

<rect x="44" y="60" width="202" height="64" rx="8" fill="#dbeafe"/>
<rect x="250" y="60" width="102" height="64" rx="8" fill="#fef3c7"/>
<rect x="356" y="60" width="206" height="64" rx="8" fill="#dcfce7"/>

<g font-size="15" text-anchor="middle">
<rect x="50"  y="74" width="40" height="36" class="box" fill="#eff6ff" stroke="#2563eb"/><text x="70"  y="98" class="id t">1</text>
<rect x="100" y="74" width="40" height="36" class="box" fill="#eff6ff" stroke="#2563eb"/><text x="120" y="98" class="id t">2</text>
<rect x="150" y="74" width="40" height="36" class="box" fill="#eff6ff" stroke="#2563eb"/><text x="170" y="98" class="id t">3</text>
<rect x="200" y="74" width="40" height="36" class="box" fill="#eff6ff" stroke="#2563eb"/><text x="220" y="98" class="id t">4</text>
<rect x="256" y="74" width="40" height="36" class="box" fill="#fffbeb" stroke="#d97706"/><text x="276" y="98" class="id t">5</text>
<rect x="306" y="74" width="40" height="36" class="box" fill="#fffbeb" stroke="#d97706"/><text x="326" y="98" class="id t">6</text>
<rect x="362" y="74" width="40" height="36" class="box" fill="#f0fdf4" stroke="#16a34a"/><text x="382" y="98" class="id t">7</text>
<rect x="412" y="74" width="40" height="36" class="box" fill="#f0fdf4" stroke="#16a34a"/><text x="432" y="98" class="id t">8</text>
<rect x="462" y="74" width="40" height="36" class="box" fill="#f0fdf4" stroke="#16a34a"/><text x="482" y="98" class="id t">9</text>
<rect x="512" y="74" width="40" height="36" class="box" fill="#f0fdf4" stroke="#16a34a"/><text x="532" y="98" class="id t">10</text>
</g>
<text x="40" y="70" class="m" font-size="11">旧 / 小 id</text>
<text x="560" y="70" class="m" font-size="11" text-anchor="end">新 / 大 id →</text>

<line x1="248" y1="56" x2="248" y2="128" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="4 3"/>
<text x="248" y="146" class="t h" font-size="12" text-anchor="middle" fill="#2563eb">▲ covered_upto = 4</text>

<path d="M356 132 L356 140 L562 140 L562 132" fill="none" stroke="#16a34a" stroke-width="2"/>
<text x="459" y="158" class="t" font-size="12" text-anchor="middle" fill="#16a34a">window_turns=4：最近 4 条，原文给 AI 看</text>

<text x="145" y="178" class="t h" font-size="12.5" text-anchor="middle" fill="#1d4ed8">已压入摘要</text>
<text x="145" y="194" class="m" font-size="11" text-anchor="middle">id ≤ covered_upto</text>
<text x="301" y="178" class="t h" font-size="12.5" text-anchor="middle" fill="#b45309">夹缝（待压）</text>
<text x="301" y="194" class="m" font-size="11" text-anchor="middle">掉出窗口但还没压</text>
<text x="459" y="178" class="t h" font-size="12.5" text-anchor="middle" fill="#15803d">窗内 · 原文</text>
<text x="459" y="194" class="m" font-size="11" text-anchor="middle">AI 直接看到</text>

<rect x="600" y="62" width="180" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="690" y="84" class="t h" font-size="13" text-anchor="middle" fill="#1d4ed8">摘要 S（缓存1条）</text>
<text x="690" y="106" class="m" font-size="11" text-anchor="middle">女技师 / 周末</text>
<text x="690" y="122" class="m" font-size="11" text-anchor="middle">推拿 / 60分钟…</text>
<text x="690" y="140" class="m" font-size="10" text-anchor="middle">存在另一张表，原消息不删</text>
<path d="M246 92 C 540 30, 560 40, 598 80" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)" opacity="0.8"/>
<text x="430" y="40" class="m" font-size="11" fill="#2563eb">压缩：多条旧消息 → 一段摘要</text>

<text x="600" y="178" class="t h" font-size="12">下一轮请求开始时喂给 AI =</text>
<text x="600" y="196" class="m" font-size="11.5">摘要 S（首条） ＋ 窗内 7–10 原文</text>

<line x1="40" y1="220" x2="780" y2="220" stroke="var(--color-border-secondary,#cbd5e1)" stroke-width="1"/>

<!-- ===== Panel B: cadence ===== -->
<text x="40" y="252" class="t h" font-size="17">② 压缩的节奏：压完夹缝归零，再积累够才触发（默认 ≥4 条 ≈ 2 回合）</text>

<g font-size="12.5" text-anchor="middle">
<rect x="44" y="278" width="150" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="119" y="304" class="t h" fill="#1d4ed8">压缩刚完成</text>
<text x="119" y="326" class="m">书签追上窗口边界</text>
<text x="119" y="342" class="t">夹缝 = 0</text>

<rect x="248" y="278" width="150" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="323" y="304" class="t h" fill="#b45309">+1 回合（+2 条）</text>
<text x="323" y="326" class="m">未达阈值</text>
<text x="323" y="342" class="t">夹缝 = 2</text>

<rect x="452" y="278" width="150" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="527" y="304" class="t h" fill="#b45309">+1 回合（+2 条）</text>
<text x="527" y="326" class="m">达到阈值！</text>
<text x="527" y="342" class="t">夹缝 = 4 ≥ 4</text>

<rect x="656" y="278" width="124" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="718" y="304" class="t h" fill="#15803d">触发压缩</text>
<text x="718" y="326" class="m">调 1 次 LLM</text>
<text x="718" y="342" class="t">夹缝归零 ↺</text>
</g>
<path d="M196 313 L246 313" fill="none" stroke="var(--color-text-secondary,#6b7280)" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M400 313 L450 313" fill="none" stroke="var(--color-text-secondary,#6b7280)" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M604 313 L654 313" fill="none" stroke="var(--color-text-secondary,#6b7280)" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M718 350 C 718 392, 119 392, 119 350" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<text x="418" y="386" class="m" font-size="11" text-anchor="middle" fill="#16a34a">回到「夹缝=0」，重新积累</text>

<rect x="44" y="408" width="736" height="40" rx="8" fill="var(--color-background-primary,#f9fafb)" stroke="var(--color-border-secondary,#cbd5e1)"/>
<text x="60" y="433" class="t" font-size="13">关键：<tspan class="h">夹缝条数 = 自上次压缩以来新增的消息数</tspan>（与窗口大小无关）→ 攒到 min_old_turns（默认4）或超 4000 token 即再压。</text>

<g font-size="12">
<rect x="44" y="478" width="16" height="16" rx="3" fill="#eff6ff" stroke="#2563eb"/>
<text x="68" y="491" class="m">已压入摘要（id ≤ covered_upto）</text>
<rect x="300" y="478" width="16" height="16" rx="3" fill="#fffbeb" stroke="#d97706"/>
<text x="324" y="491" class="m">夹缝：掉出窗口、待压缩</text>
<rect x="556" y="478" width="16" height="16" rx="3" fill="#f0fdf4" stroke="#16a34a"/>
<text x="580" y="491" class="m">窗内：原文喂 AI</text>
</g>
</svg>
